<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Compressor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        .settings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 0.9rem;
        }
        input[type="number"] {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #fileInput {
            display: none;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary {
            background-color: #007aff;
            color: white;
        }
        .btn-primary:disabled {
            background-color: #ccc;
        }
        #status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #eee;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }
        #progressFill {
            width: 0%;
            height: 100%;
            background: #34c759;
            transition: width 0.1s;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📷 Photo Compress</h1>
        
        <div class="settings">
            <div>
                <label>Quality (1-100):</label>
                <input type="number" id="quality" value="65">
            </div>
            <div>
                <label>Max Width (px):</label>
                <input type="number" id="maxRes" value="1280">
            </div>
        </div>

        <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp" multiple>
        <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">Select Photos</button>
        
        <div class="progress-bar" id="progressBar">
            <div id="progressFill"></div>
        </div>
        <div id="status">Ready. No images selected.</div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            const quality = document.getElementById('quality').value / 100;
            const maxRes = parseInt(document.getElementById('maxRes').value);
            
            progressBar.style.display = 'block';
            status.innerText = `Processing ${files.length} images...`;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                // Update Progress
                const percent = ((i + 1) / files.length) * 100;
                progressFill.style.width = percent + '%';

                try {
                    await compressAndDownload(file, quality, maxRes);
                } catch (err) {
                    console.error(`Error processing ${file.name}:`, err);
                }
            }

            status.innerText = `Done! ${files.length} images processed.`;
            setTimeout(() => { progressBar.style.display = 'none'; }, 3000);
        });

        async function compressAndDownload(file, quality, maxRes) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        // Resize logic (maintain aspect ratio)
                        if (width > maxRes) {
                            height = Math.round((height * maxRes) / width);
                            width = maxRes;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Convert to WebP
                        // Note: Some iOS versions might fallback to JPEG if WebP isn't supported in canvas
                        canvas.toBlob((blob) => {
                            if (!blob) {
                                reject('Compression failed');
                                return;
                            }
                            
                            // Create download link
                            const url = URL.createObjectURL(blob);
                            const link = document.createElement('a');
                            link.href = url;
                            
                            // Rename file to .webp
                            const name = file.name.substring(0, file.name.lastIndexOf('.')) + ".webp";
                            link.download = name;
                            
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            URL.revokeObjectURL(url);
                            
                            resolve();
                        }, 'image/webp', quality);
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }
    </script>
</body>
</html>
